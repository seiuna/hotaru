# Admin console static hosting.
# The SPA owns clean URLs (/users/:id), so unknown paths must fall back to
# index.html instead of 404ing at the web-server layer.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed assets can be cached hard; index.html must not be.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence in depth: the console never embeds third-party frames or scripts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never log authorization headers or query strings.
    access_log off;
}
