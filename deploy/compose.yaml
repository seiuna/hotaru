# MC Auth Platform — production-ish single-host stack.
#
# Security posture:
#   * Only Caddy publishes ports to the host (80/443). MongoDB, Redis and the
#     auth server live on an internal Docker network and are unreachable from
#     the internet.
#   * MongoDB runs with --auth and a dedicated root user.
#   * Redis is password-protected and bound to the internal network only.
#
# Usage:
#   cp deploy/.env.example deploy/.env   # then edit the secrets
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set in deploy/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set in deploy/.env}
    volumes:
      - mongo-data:/data/db
    networks:
      - internal
    # Deliberately no `ports:` — the database is never exposed to the host.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
            db.getSiblingDB("admin").auth(
              process.env.MONGO_INITDB_ROOT_USERNAME,
              process.env.MONGO_INITDB_ROOT_PASSWORD
            ).ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set in deploy/.env}
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  auth-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-hotaru_auth}
      # Additive index creation on boot; unique constraints must exist before traffic.
      MONGODB_ENSURE_INDEXES: ${MONGODB_ENSURE_INDEXES:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set in deploy/.env}
      JWT_ISSUER: ${PUBLIC_BASE_URL:?set in deploy/.env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-hotaru-api}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      CHALLENGE_TTL_SECONDS: ${CHALLENGE_TTL_SECONDS:-60}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_CHALLENGE_MAX: ${RATE_LIMIT_CHALLENGE_MAX:-10}
      RATE_LIMIT_VERIFY_MAX: ${RATE_LIMIT_VERIFY_MAX:-10}
      MOJANG_SESSION_SERVER: ${MOJANG_SESSION_SERVER:-https://sessionserver.mojang.com}
      MOJANG_HAS_JOINED_TIMEOUT_MS: ${MOJANG_HAS_JOINED_TIMEOUT_MS:-5000}
      MOJANG_HAS_JOINED_ATTEMPTS: ${MOJANG_HAS_JOINED_ATTEMPTS:-2}
      MOJANG_RETRY_DELAY_MS: ${MOJANG_RETRY_DELAY_MS:-500}
      DEFAULT_SCOPES: ${DEFAULT_SCOPES:-hotaru:profile}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Ed25519 public key for signed activation codes (escaped newlines are fine).
      ACTIVATION_PUBLIC_KEY_PEM: ${ACTIVATION_PUBLIC_KEY_PEM:-}
      # Optional: bring-your-own PEMs. Empty means "generate once and persist in
      # MongoDB". Forwarded explicitly so an operator uncommenting them in
      # deploy/.env actually reaches loadConfig().
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      MINECRAFT_RSA_PRIVATE_KEY_PEM: ${MINECRAFT_RSA_PRIVATE_KEY_PEM:-}
      MINECRAFT_RSA_PUBLIC_KEY_PEM: ${MINECRAFT_RSA_PUBLIC_KEY_PEM:-}
    networks:
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # SRP v1 IRC server: one WebSocket endpoint (/v1/connect) plus a small REST
  # API for groups/filters/presence. Like the auth server it has no published
  # ports — Caddy is the only way in, and the mongo/redis network is never
  # exposed to the host.
  irc-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.irc-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The JWKS endpoint is the trust anchor for every token; booting before it
      # is reachable would only produce upgrade failures.
      auth-server:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGODB_DB: ${MONGODB_IRC_DB:-hotaru_irc}
      # Additive index creation on boot. Unique constraints and the audit-log TTL
      # are correctness requirements, so this stays on unless a migration job
      # owns index management.
      MONGODB_ENSURE_INDEXES: ${MONGODB_IRC_ENSURE_INDEXES:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Same trust anchor and issuer as the auth server's own tokens.
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth-server:3000/api/v1/auth/jwks}
      JWT_ISSUER: ${PUBLIC_BASE_URL:?set in deploy/.env}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-hotaru-api}
      JWKS_CACHE_TTL_MS: ${JWKS_CACHE_TTL_MS:-600000}
      INSTANCE_ID: ${INSTANCE_ID:-irc-01}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
      PONG_TIMEOUT_MS: ${PONG_TIMEOUT_MS:-15000}
      PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-90000}
      MAX_CONNECTIONS_PER_USER: ${MAX_CONNECTIONS_PER_USER:-3}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-20}
      MAX_CONNECTIONS_TOTAL: ${MAX_CONNECTIONS_TOTAL:-10000}
      MESSAGE_RATE_PER_SEC: ${MESSAGE_RATE_PER_SEC:-20}
      MESSAGE_BURST: ${MESSAGE_BURST:-40}
      GROUP_MESSAGE_RATE_PER_SEC: ${GROUP_MESSAGE_RATE_PER_SEC:-10}
      CREATE_GROUP_PER_HOUR: ${CREATE_GROUP_PER_HOUR:-5}
      MAX_PAYLOAD_BYTES: ${MAX_PAYLOAD_BYTES:-65536}
      MAX_FRAME_BYTES: ${MAX_FRAME_BYTES:-131072}
      MAX_GROUP_MEMBERS: ${MAX_GROUP_MEMBERS:-100}
      MAX_WS_BUFFERED_BYTES: ${MAX_WS_BUFFERED_BYTES:-1048576}
      DEDUPE_TTL_MS: ${DEDUPE_TTL_MS:-120000}
      ADMIN_UUIDS: ${IRC_ADMIN_UUIDS:-}
      BROADCAST_ENABLED: ${BROADCAST_ENABLED:-true}
      CORS_ORIGINS: ${IRC_CORS_ORIGINS:-}
    networks:
      - internal
    # Deliberately no `ports:` — the WebSocket edge is Caddy, never the host.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  admin-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin-web
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  user-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.user-portal
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      auth-server:
        condition: service_started
      irc-server:
        condition: service_started
      admin-web:
        condition: service_started
      user-portal:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set in deploy/.env}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.${AUTH_DOMAIN}}
      USER_DOMAIN: ${USER_DOMAIN:-user.${AUTH_DOMAIN}}
      IRC_DOMAIN: ${IRC_DOMAIN:?set in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  caddy-data:
  caddy-config:
