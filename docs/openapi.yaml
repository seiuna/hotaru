                additionalProperties: false
  "/api/v1/admin/users":
    get:
      summary: "Search users by username substring or Minecraft-UUID prefix"
      tags:
        - admin
      parameters:
        - schema:
            type: string
            maxLength: 64
          in: query
          name: query
          required: false
        - schema:
            type: string
            enum:
              - active
              - banned
          in: query
          name: status
          required: false
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          in: query
          name: limit
          required: false
        - schema:
            type: integer
            minimum: 0
            default: 0
          in: query
          name: offset
          required: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Default Response"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: "^[0-9a-f]{24}$"
                        minecraftUuid:
                          type: string
                          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                        username:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - banned
                        createdAt:
                          type: string
                        lastLoginAt:
                          type:
                            - "null"
                            - string
                      required:
                        - id
                        - minecraftUuid
                        - username
                        - status
                        - createdAt
                        - lastLoginAt
                      additionalProperties: false
                  total:
                    type: integer
                    minimum: 0
                  limit:
                    type: integer
                    exclusiveMinimum: 0
                  offset:
                    type: integer
                    minimum: 0
                required:
                  - users
                  - total
                  - limit
                  - offset
                additionalProperties: false
        "401":
          description: "Default Response"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - INVALID_REQUEST
                          - CHALLENGE_NOT_FOUND
                          - CHALLENGE_EXPIRED
                          - CHALLENGE_CONSUMED
                          - NOT_A_PREMIUM_SESSION
                          - MOJANG_UNAVAILABLE
                          - RATE_LIMITED
                          - UNAUTHORIZED
                          - TOKEN_EXPIRED
                          - SESSION_REVOKED
                          - REFRESH_REUSED
                          - USER_BANNED
                          - FORBIDDEN
                          - NOT_FOUND
                          - INTERNAL
                      message:
                        type: string
                      retryable:
                        type: boolean
                      details: {}
                    required:
                      - code
                      - message
                      - retryable
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
        "403":
          description: "Default Response"
