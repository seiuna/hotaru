  "/api/v1/admin/users/{id}/ban":
    post:
      summary: "Ban a user and revoke all of their active sessions"
      tags:
        - admin
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
              additionalProperties: false
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: "Default Response"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: "^[0-9a-f]{24}$"
                      minecraftUuid:
                        type: string
                        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                      username:
                        type: string
                      status:
                        type: string
                        enum:
                          - active
                          - banned
                      createdAt:
                        type: string
                      lastLoginAt:
                        type:
                          - "null"
                          - string
                    required:
                      - id
                      - minecraftUuid
                      - username
                      - status
                      - createdAt
                      - lastLoginAt
                    additionalProperties: false
                  sessionsRevoked:
                    type: integer
                    minimum: 0
                required:
