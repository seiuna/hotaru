                          - "hotaru:resource"
                          - "hotaru:ircserver"
                          - "hotaru:license"
                          - "admin:users"
                      expiresAt:
                        anyOf:
                          - type: string
                            format: date-time
                          - type: "null"
                    required:
                      - scope
                    additionalProperties: false
                  maxItems: 32
              required:
                - permissions
              additionalProperties: false
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
