                        enum:
                          - INVALID_REQUEST
                          - CHALLENGE_NOT_FOUND
                          - CHALLENGE_EXPIRED
                          - CHALLENGE_CONSUMED
                          - NOT_A_PREMIUM_SESSION
                          - MOJANG_UNAVAILABLE
                          - RATE_LIMITED
                          - UNAUTHORIZED
                          - TOKEN_EXPIRED
                          - SESSION_REVOKED
                          - REFRESH_REUSED
                          - USER_BANNED
                          - FORBIDDEN
                          - NOT_FOUND
                          - INTERNAL
