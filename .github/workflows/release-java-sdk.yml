name: Build Java SDK

# Builds and packages the Java SDK (auth + IRC client + REST client).
#  * on a published GitHub Release: the jars are attached to that release
#  * on workflow_dispatch: build + test only (no release needed)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp into the jars (without v)'
        required: false
        default: '0.0.0'

permissions:
  contents: write

concurrency:
  group: java-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/skymatrix-sdk-java

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: ''

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="${{ inputs.version }}"
          fi
          VERSION="${RAW#v}"
          if [ -z "$VERSION" ]; then VERSION="0.0.0"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build, test and package
        run: bash ./build.sh "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skymatrix-sdk-java-${{ steps.version.outputs.version }}
          path: clients/skymatrix-sdk-java/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Attach artifacts to the GitHub Release
        if: github.event_name == 'release'
        working-directory: clients/skymatrix-sdk-java
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/skymatrix-sdk-java-*.jar \
            dist/SHA256SUMS.txt \
            --clobber

      - name: Summary
        run: |
          {
            echo "### Skymatrix Java SDK ${{ steps.version.outputs.version }}"
            echo
            echo "| artifact | size |"
            echo "| --- | --- |"
            for f in dist/*.jar dist/SHA256SUMS.txt; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
